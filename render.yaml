# Free hosting: one Render free web service (app + API + live updates) and a Neon free Postgres database.
# Render's own free Postgres is deliberately not used: it is deleted 30 days after creation.
# See README "Run it for free".
services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Paste the Neon connection string (postgresql://…?sslmode=require) when Render asks for it.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        generateValue: true
      # Emailed links (password reset, sign-in, verification) point here; never taken from the request.
      - key: App__PublicUrl
        value: https://expense-tracker-api-1bsk.onrender.com
      # Brevo (free, 300 emails/day; Render's free plan blocks SMTP). Without a key, email features stay hidden.
      - key: Email__BrevoApiKey
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Jwt__Issuer
        value: ExpenseTracker.Api
      - key: Jwt__Audience
        value: ExpenseTracker.Client
      - key: Jwt__ExpiryMinutes
        value: "43200"
      - key: BudgetAlerts__WarningThresholdPercent
        value: "80"
      - key: CurrencyRates__ReportingCurrency
        value: USD
      - key: CurrencyRates__Rates__USD
        value: "1.0"
      - key: CurrencyRates__Rates__PKR
        value: "0.0036"
      - key: CurrencyRates__Rates__EUR
        value: "1.08"
